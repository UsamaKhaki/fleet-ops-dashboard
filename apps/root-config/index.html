<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Fleet Ops</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e9a23b'/%3E%3Cpath d='M5 15h9V8h3l2 3v4h-1' stroke='%23231a0e' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <script>
      // Runs before first paint so a dark-mode user never sees a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('fleet-ops:theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="shell"></div>
    <main class="mx-auto w-full max-w-7xl px-4 py-6">
      <div id="route-status" class="text-sm text-muted-foreground" role="status" aria-live="polite">
        Loading…
      </div>
      <div id="app-content"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
